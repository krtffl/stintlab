[package]
name = "stintlab-viz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stintlab-core = { path = "../stintlab-core" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "console",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
