<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stintlab - F1 Strategy Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>stintlab</h1>
        <p class="subtitle">Data-driven F1 strategy analytics</p>
    </header>

    <main>
        <section id="race-selector">
            <h2>Select a Race</h2>
            <div class="controls">
                <label for="season-select">Season:</label>
                <select id="season-select">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024" selected>2024</option>
                </select>
            </div>
            <div id="race-list" class="race-grid">
                <p class="loading">Loading races...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Built with Rust + WebAssembly</p>
    </footer>

    <script src="app.js" type="module"></script>
</body>
</html>
